/* Pixel2Vector AI Studio craft layer: tactile detail, clear edges, and quiet motion. */
:root{--craft-line:rgba(225,235,248,.13);--craft-accent:#78cbd8;--craft-ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:auto!important;scroll-padding-top:86px}
body{overscroll-behavior-y:contain}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.nav .ico{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:currentColor}
.nav .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{transition:transform .22s var(--craft-ease),border-color .22s var(--craft-ease),background .22s var(--craft-ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.985)}
.projectcard,.family,.pattern,.asset,.icon-tile,.recipe-card,.snippet-card{transition:transform .35s var(--craft-ease),border-color .3s var(--craft-ease),background .3s var(--craft-ease)}
.projectcard:hover,.family:hover,.pattern:hover,.asset:hover,.icon-tile:hover,.recipe-card:hover,.snippet-card:hover{transform:translateY(-3px);border-color:#53647b}
.projectcard img,.asset img,.asset video{transition:transform .55s var(--craft-ease)}
.asset:hover img{transform:scale(1.025)}
.scroll-progress{height:2px;position:fixed;z-index:100;left:0;right:0;top:0;background:transparent;pointer-events:none}
.scroll-progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#5b8cff,#83d6df);box-shadow:0 0 14px #62bfcb70}
.scroll-ruler{position:fixed;right:13px;top:50%;transform:translateY(-50%);z-index:12;display:flex;align-items:center;gap:8px;pointer-events:none;color:#667384;font:9px ui-monospace,monospace;letter-spacing:.08em}
.scroll-ruler .rail{width:2px;height:104px;background:#28313c;position:relative;border-radius:3px}
.scroll-ruler .rail i{position:absolute;top:0;left:0;width:2px;height:0;background:#75cbd8;border-radius:3px;box-shadow:0 0 10px #75cbd850}
.scroll-ruler b{font-weight:500;writing-mode:vertical-rl;transform:rotate(180deg);min-width:20px}
.craft-hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;min-height:230px;padding:25px;background:radial-gradient(ellipse at 78% 28%,#2452d84a,transparent 35%),linear-gradient(120deg,#121922,#0e1218 65%,#111a21);display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:18px}
.craft-hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(90deg,transparent,black 65%);pointer-events:none}
.craft-hero h2{font-size:clamp(28px,4vw,46px);letter-spacing:-1.8px;line-height:.98;margin:10px 0;max-width:560px}
.craft-hero p{color:#aab5c2;font-size:12px;line-height:1.65;max-width:520px}
.craft-hero .eyebrow,.craft-hero h2,.craft-hero p,.craft-hero .btn{position:relative;z-index:1}
.craft-orbit{position:relative;z-index:1;min-height:170px;display:grid;place-items:center}
.craft-orbit .orbit{position:absolute;width:160px;height:160px;border:1px solid #85a2c52d;border-radius:50%;animation:orbit-turn 24s linear infinite}
.craft-orbit .orbit:before,.craft-orbit .orbit:after{content:"";position:absolute;border:1px solid #85a2c52d;border-radius:50%;inset:18px}
.craft-orbit .orbit:after{inset:42px}
.craft-core{width:67px;height:67px;border:1px solid #7fbbd577;background:#17232d;border-radius:20px;display:grid;place-items:center;box-shadow:0 0 50px #5d9fa51c;position:relative;z-index:1}
.craft-core svg{width:29px;height:29px;stroke:#aee1e8;fill:none;stroke-width:1.5}
@keyframes orbit-turn{to{transform:rotate(360deg)}}
.craft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.icon-tile{background:#121820;border:1px solid var(--line);border-radius:11px;min-height:128px;padding:13px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-width:0}

<script id="graphdata" type="application/json">{"id":"PixelPieVisualMemory","nodes":[{"id":"STYLE_ROOT","label":"PixelPie Visual Style Memory","kind":"style_system","description":"Central versioned memory for two distinct visual families, their assets, palettes, modes, production rules and future ingestion."},{"id":"SHARED_GRAMMAR","label":"Shared visual grammar","kind":"design_principle","description":"High contrast hierarchy, asymmetric alignment, semantic proof objects, compact metadata, selective texture and legibility-first craft."},{"id":"TYPOGRAPHY","label":"Typography hierarchy","kind":"design_principle","description":"Oversized condensed display type, neutral readable body sans and monospaced micro-metadata; no essential information may depend on microtext."},{"id":"GRID","label":"Asymmetric grid and reading path","kind":"design_principle","description":"Strong outer frame, aligned anchors, deliberate zones and readable movement across paper, image and UI planes."},{"id":"PROOF_OBJECT","label":"Semantic proof object","kind":"design_principle","description":"One dominant UI, physical object, diagram, photograph or evidence panel must support the message rather than exist as decoration."},{"id":"TEXTURE","label":"Controlled print material","kind":"design_principle","description":"Localized grain, halftone, scratches, photocopy abrasion, dry brush and torn edges; critical copy and UI stay crisp."},{"id":"TECH_GEOMETRY","label":"Technical annotation geometry","kind":"design_principle","description":"Rulers, crosshairs, registration marks, arrows, perimeter frames and modules are used only to explain measurement, sequence or structure."},{"id":"ICONOGRAPHY","label":"Functional geometric iconography","kind":"design_principle","description":"Consistent geometric mono-line symbols with a semantic role; no decorative emoji or mixed icon families."},{"id":"BRAND_GUARD","label":"PixelPie logo guardrail","kind":"brand_rule","description":"Use supplied logo assets intact and proportionally. Orange belongs to the supplied logo asset, not the general technical palette."},{"id":"PALETTE_LOCK","label":"Palette separation rule","kind":"style_constraint","description":"Choose one dominant family palette per composition. Do not merge palettes or use random rainbow accents; cross-family mixing requires an explicit brief."},{"id":"CONTENT_TRUTH","label":"Content integrity and factual truth","kind":"quality_gate","description":"Never invent UI labels, dates, metrics, benchmarks, security claims, coordinates or brand marks; visual references are not factual proof."},{"id":"QA_3PASS","label":"Three-pass quality gate","kind":"quality_gate","description":"Review brief and hierarchy, visual system consistency, then factual integrity, legibility and production craft."},{"id":"ROUTER","label":"Family and mode router","kind":"workflow","description":"Select family by communication intent first, then choose one primary mode; use a second mode only when it supports the message."},{"id":"INGEST","label":"Incremental reference ingestion","kind":"workflow","description":"Fingerprint each new file, identify duplicates, apply chromatic eligibility, inspect individually, classify family/mode and add evidence edges without overwriting history."},{"id":"SIGNAL_FAMILY","label":"Signal Editorial","kind":"style_family","description":"Expressive violet, magenta, acid-lime and red editorial collage; suited to creator critique, cultural argument, emotional storytelling and energetic brand communication."},{"id":"SIGNAL_PALETTE","label":"Signal editorial palette","kind":"palette","description":"Ink #09090B and warm paper #F1EEE7 base; choose one dominant violet #6418E8 or magenta #E20A70; acid-lime #E8F31A, cobalt #2452D8 and signal-red #E52B32 remain controlled secondary signals."},{"id":"INDUSTRIAL_FAMILY","label":"Industrial Technical Editorial","kind":"style_family","description":"Cobalt-led technical editorial brutalism with industrial diagrams, warm paper, crisp dark product UI, documentation and controlled print collage."},{"id":"INDUSTRIAL_PALETTE","label":"Cobalt technical palette","kind":"palette","description":"Ink #101114, black #050608, warm paper #F0EEE6 and cobalt #174CE6; steel and white are neutrals; red, yellow and cyan are semantic micro-accents only."},{"id":"SIG_SYSTEM","label":"System-led editorial","kind":"visual_mode","description":"Structured headline plus product or message proof, a controlled accent slab and compact brand footer."},{"id":"SIG_CREATOR","label":"Creator and comic energy","kind":"visual_mode","description":"Expressive close-ups, editing timelines, comic halftone, angular marks and high-energy violet, yellow or red interventions."},{"id":"SIG_ARCH","label":"Architectural editorial argument","kind":"visual_mode","description":"Brutalist spatial photography, oversized editorial typography, black fields and restrained violet or lime signals."},{"id":"SIG_DOC","label":"Urban documentary collage","kind":"visual_mode","description":"Grayscale-led documentary photo panels with deliberate lime annotation; retain only when the chromatic mark is intentional."},{"id":"IND_CAMPAIGN","label":"Campaign collage","kind":"visual_mode","description":"Oversized headline, cobalt phrase slab, warm stock, one clear product or device proof and compact footer."},{"id":"IND_UI","label":"Dark UI evidence","kind":"visual_mode","description":"Dark application UI as the main proof, with readable rows, accurate labels, state chips and local highlights."},{"id":"IND_SCHEMATIC","label":"Technical convergence","kind":"visual_mode","description":"Two to four meaningful modules connected by directional arrows, using consistent isometric or orthographic geometry."},{"id":"IND_LEDGER","label":"Document and ledger","kind":"visual_mode","description":"Warm paper, precise table grid, fixed columns, ruler marks and monospaced metadata."},{"id":"IND_SECURITY","label":"Security and incident","kind":"visual_mode","description":"Alert plaques, threat boundaries, diagnostic panels and evidence labels; claims and metrics must be verified."},{"id":"IND_ONBOARD","label":"Onboarding and file flow","kind":"visual_mode","description":"One file tile, drop field, cursor or single control, with minimal one-step guidance."},{"id":"IND_STATUS","label":"Status and comparison","kind":"visual_mode","description":"Matched panels, explicit legends and aligned rows for completed, blocked, pass or fail states."},{"id":"IND_DIAGNOSTIC","label":"Diagnostic hero","kind":"visual_mode","description":"A single central object or system examined by probes, perimeter frames and calibration marks."},{"id":"SIG-ASSET-01","label":"blue workday operator variant","kind":"reference_image","description":"Alternate cobalt-blue capture of the workday-control poster. Same headline/building/laptop/footer system as the magenta master. The source includes blurred top/bottom padding and a floating white app mark obscuring the dashboard, so treat it as a variant/color study, not the canonical layout reference."},{"id":"SIG-ASSET-02","label":"workday operator master","kind":"reference_image","description":"Canonical high-clarity poster. Off-white distressed paper, oversized black headline, magenta torn-paper band, monochrome architectural facade on the right, centered laptop dashboard, precise metadata row, and bold footer lockup. Strongest reference for hierarchy, product storytelling, and controlled collage."},{"id":"SIG-ASSET-03","label":"creator timeline comic","kind":"reference_image","description":"Purple comic-book close-up of a stressed creator over an editing timeline. Face and hand dominate the upper field; the Premiere-like timeline occupies the lower half. Halftone ink, electric purple, yellow filler-word labels, green/purple waveforms, blue secondary track, red warning labels. The software interface is content, not decorative noise."},{"id":"SIG-ASSET-04","label":"code to vector symbol","kind":"reference_image","description":"Minimal product graphic on warm white. Two offset skewed cards translate code brackets into a Bézier pen/path symbol via a white arrow. Black, saturated violet, and acid-lime backing plate; crisp silhouette, generous negative space, small halftone edge detail. Best reference for simple explanatory marks and transformation diagrams."},{"id":"SIG-ASSET-05","label":"after the noise banner","kind":"reference_image","description":"Wide cinematic banner. A hard black angular text field anchors an italic editorial serif headline; brutalist concrete stairs and beams occupy the right; torn architectural image fragments, violet blocks, tiny acid-yellow line, faint technical grid and crosshair marks. Quiet, spacious mode of the system."},{"id":"SIG-ASSET-06","label":"creator critique social capture","kind":"reference_image","description":"Social-feed screenshot containing a long critique above a vivid poster. The embedded poster uses a red-tinted creator portrait, laptop editing timeline, speech bubble, purple/yellow angular graphics, and hand-drawn warning marks. Preserve the original as contextual evidence; use the extracted poster crop for visual generation, never reproduce the social UI."},{"id":"SIG-ASSET-07","label":"saved reels execution poster","kind":"reference_image","description":"High-energy vertical poster built around an oversized comic figure and reaching hand. Cascading play-button thumbnails, giant stacked question/command typography, violet field, acid-yellow emphasis, red/black ink, cream paper, halftone and cut-paper edges. Hourglass and crossed-out symbol reinforce the execution-versus-consumption message."},{"id":"SIG-ASSET-08","label":"engine room glitch poster","kind":"reference_image","description":"Vertical architectural collage with a giant distorted circular/letterform center, fragmented monumental type, black-and-white concrete photography, saturated violet strips, acid-lime blocks and halftone field. Horizontal displacement/glitch is structural and deliberate. Use as a high-impact conceptual poster reference, not as the default readability template."},{"id":"SIG-ASSET-09","label":"performance rigged poster","kind":"reference_image","description":"Vertical editorial argument built from modular zones: small narrative copy upper left, huge cream display type on violet panels, street/building photography on the right, lime callout block, black technical lower panel with gauge-like numeric readout. Strong asymmetry, hard grid, crosshairs, worn paper and purposeful scale contrast."},{"id":"SIG-ASSET-10","label":"lime marked urban documentary","kind":"reference_image","description":"Three-part black-and-white urban photo collage: subway platform wide shot, close portrait panel, and lower shoe/street detail. Acid-lime hand marks anonymize faces and add editorial direction. Grain, deep blacks, documentary framing and deliberate panel seams. This is grayscale-led but not monochrome, so it is retained."},{"id":"SIG-ASSET-11","label":"creator critique poster crop","kind":"reference_image","description":"Derived crop of the poster embedded inside the social-feed screenshot. Use this crop as the actual creative reference; use the full screenshot only to understand the critique context."},{"id":"PP-01","label":"1000155179.png_356b3a5d.jpg","kind":"reference_image","description":"Your Workday Under Control. A tall hero composition with a dark product interface centered between oversized headline bands, PixelPie signature, and a strong blue/black/cream structure. The source file is 1080×1920; top and bottom blur bands appear to be framing residue, not a design motif to reproduce."},{"id":"PP-02","label":"Autonomous_workspace_operator_br…_b27b9b08.jpg","kind":"reference_image","description":"Autonomous Workspace Operator headline on warm paper with a cobalt title strip, torn black collage field on the right, small skill badge, and a compact CTA/footer. The middle is intentionally quieter than the headline and footer."},{"id":"PP-03","label":"Autonomous_workspace_operator_mo…_f4c57c8d.jpg","kind":"reference_image","description":"A narrow, tall typographic treatment. Autonomous Workspace Operator dominates in stacked condensed uppercase, with Operator reversed out in cobalt. Supporting promise and Explore the Skill CTA sit below. Torn monochrome collage and large corner arrows frame the copy."},{"id":"PP-04","label":"Blank_document_sheet_on_grid_017a12b2.jpg","kind":"reference_image","description":"Paper-first blank ledger sheet with a precise multi-column table, numbered rows, micro labels, ruler-like edge marks, registration corners, and restrained black photocopy wear. It is intentionally less saturated than campaign posters."},{"id":"PP-05","label":"Digital_schedule_graphic_design_406daccd.jpg","kind":"reference_image","description":"Automated Daily Brief and 07:00 schedule headline above a dark task interface. Cobalt strips carry the time and key phrase; the interface is framed as the central proof; a recurring footer identifies the workspace operator system."},{"id":"PP-06","label":"Document_layout_with_blue_accents_731f02d9.jpg","kind":"reference_image","description":"Important Context Kept in One Place. A paper document/table is the core visual proof, with a large black headline, cobalt keyword strip, ruled data rows, tiny technical labels, and a low-contrast footer."},{"id":"PP-07","label":"Empty_Gmail_inbox_on_laptop_ddffd0a6.jpg","kind":"reference_image","description":"Large Initial State title over a dark workspace dashboard, with a blue-and-white hierarchy and a bottom message that Gmail Triage is waiting for input. The interface is tilted/cropped within the frame to add movement."},{"id":"PP-08","label":"Exploit_test_comparison_card_9b8d5b30.jpg","kind":"reference_image","description":"Two adjacent dark result panels contrast a completed cyber test with a refused/blocked outcome. Blue marks the completed side, muted grey marks the refusal. Large percentage and status text carry the result."},{"id":"PP-09","label":"Firefox_browser_detects_security…_c7547375.jpg","kind":"reference_image","description":"Firefox security headline with Bengali support copy above a dark, framed alert interface. The detection count becomes the visual focal point, surrounded by technical panel lines and cobalt separators."},{"id":"PP-10","label":"Firefox_security_flaw_motion_gra…_b11bf6ef.jpg","kind":"reference_image","description":"Firefox Bengali headline and a large rounded-square browser app icon over torn paper and cobalt/black geometric blocks. This is an icon-led announcement, not a dense dashboard explainer."},{"id":"PP-11","label":"Gemini_displays_daily_brief_sche…_43688fd5.jpg","kind":"reference_image","description":"Set 7:00 AM Trigger headline above a single dark scheduling panel. The composition is intentionally sparse in the central paper field, with cobalt title emphasis and sharp dark/cobalt edges."},{"id":"PP-12","label":"Gemini_skills_menu_mobile_view_735f3f6a.jpg","kind":"reference_image","description":"Zero Code Setup, Skill Installed headline with a tall mobile Gemini skills screen as the central subject. The product UI is surrounded by rough paper and monochrome collage, then grounded by the system footer."},{"id":"PP-13","label":"Geometric_modules_converging_int…_290565d2.jpg","kind":"reference_image","description":"Detection, Testing, Protection is represented by three distinct isometric modules converging toward one unified core. Strong cobalt plates, ink outlines, arrows, and a heavy bottom caption create a technical poster with a clear process metaphor."},{"id":"PP-14","label":"Geometric_modules_converging_int…_5c3f21a7.jpg","kind":"reference_image","description":"A more symmetrical, high-impact variant of the three-module system. The geometric objects rise and meet around a central axis; diagonal cobalt bars and an uncluttered headline reinforce the engineering-poster feel."},{"id":"PP-15","label":"Geometric_modules_converging_int…_b09c99ec.jpg","kind":"reference_image","description":"Three labeled stages, Detection, Testing, Protection, feed into a complex modular assembly. The lower headline is oversized and stacked, with cobalt blocks used as directional emphasis."},{"id":"PP-16","label":"Gmail_inbox_priority_drafts_review_fa8f57d5.jpg","kind":"reference_image","description":"Crisp Daily Brief and Drafts for Review headline over a dark email interface with an open draft modal. The screen contains detailed task context; the composition uses strong typography and a footer band."},{"id":"PP-17","label":"Gmail_UI_priorities_motion_graphic_2a44ca2b.jpg","kind":"reference_image","description":"Less Inbox Chaos, Clearer Priorities uses a slanted monochrome email dashboard crop beneath a torn paper headline. Cobalt highlights one keyword; a dense bottom system footer anchors the image."},{"id":"PP-18","label":"Google_Tasks_planning_interface_…_fae15882.jpg","kind":"reference_image","description":"A dark Google Tasks list panel is presented as the hero, with a blue-framed headline and a bold bottom promise about better task planning. The panel uses priority chips and compact rows."},{"id":"PP-19","label":"GPT-6_cyber_campaign_exploit_test_31355c79.jpg","kind":"reference_image","description":"Exploit Test claim with Bengali success copy and a pair of dark GPT-6 Cyber result modules, one successful and one refused. The page uses torn black collage, cobalt strips, and a bottom results banner."},{"id":"PP-20","label":"GPT-6_CYBER_headline_card_graphic_03b470c8.jpg","kind":"reference_image","description":"GPT-6 Cyber headline paired with Bengali explanatory copy. A central layered security alert panel is suspended in a rough collage field with ripped paper, cobalt fragments, and black texture."},{"id":"PP-21","label":"GPT-6_Cyber_motion_graphic_layout_db0e74ac.jpg","kind":"reference_image","description":"A warm-white, nearly empty composition with a fine cobalt perimeter and a centered blue security alert placard. The small logo sits quietly at the top. It has significantly more negative space than the main poster family."},{"id":"PP-22","label":"GPT-6_Cyber_security_alert_card_045aadb8.jpg","kind":"reference_image","description":"GPT-6 Cyber bilingual headline over a dark security dashboard and alert card, with the 81-finding count and application UI arranged in a tight vertical stack. A bottom blue/white label closes the story."},{"id":"PP-23","label":"logo.png_63724540.png","kind":"brand_asset","description":"Wide PixelPie Media wordmark artwork with an orange left block and metallic grey/black dimensional typography on white. The aspect ratio is about 3:1 and the artwork is not a poster palette reference."},{"id":"PP-24","label":"Mobile_interface_displaying_sche…_62155301.jpg","kind":"reference_image","description":"Connect Workspace and 07:00 AM Schedule headline above a mobile workspace mockup. Integration symbols form a connected workflow around the phone, with cobalt callouts and a branded footer."},{"id":"PP-25","label":"Opposing_testing_panels_displayed_3314e828.jpg","kind":"reference_image","description":"A pair of side-by-side vertical panels, blue for positive checks and red/orange for negative checks. Repeated geometric status marks make it read as a diagnostic evaluation board."},{"id":"PP-26","label":"Probes_examining_black_software_…_ab565219.jpg","kind":"reference_image","description":"A sealed black software cube is surrounded by probing instruments and precision test devices over a cobalt field. Isometric perspective, hard-edged shadows, and technical labels create a mechanical diagnostic metaphor."},{"id":"PP-27","label":"Safety_boundary_box_on_poster_deb37d26.jpg","kind":"reference_image","description":"Safety Scope headline and Bengali success claim above a dark perimeter dashboard with an authorization state. The UI is framed by measurement marks and a strong blue confirmation band."},{"id":"PP-28","label":"Safety_perimeter_wall_drawing_shut_3df816f8.jpg","kind":"reference_image","description":"A large central lock and boundary frame sit on a clean paper field, surrounded by directional arrows and cobalt corner blocks. The composition shifts from dense UI to a single iconic security metaphor."},{"id":"PP-29","label":"Skill_file_added_to_Gemini_9aba1349.jpg","kind":"reference_image","description":"Zero Code Setup headline with a dark Gemini skill UI showing a skill file added and an active/installed status. The screen floats inside a torn-paper and cobalt frame."},{"id":"PP-30","label":"Skill_file_entering_search_box_f368199e.jpg","kind":"reference_image","description":"Add Skill File headline, a single floating document icon, and a slim search/drop input on a clean white field with a cobalt border. The design is restrained and negative-space-led."},{"id":"PP-31","label":"Toggle_switch_setting_daily_brief_93d037f0.jpg","kind":"reference_image","description":"Set 7:00 AM Trigger title with one floating dark switch panel and a cobalt active toggle on a lightly distressed paper field. It is a highly focused control-state visual."},{"id":"PP-32","label":"Two_opposing_testing_panels_disp…_6f623071.jpg","kind":"reference_image","description":"Dense two-column checklists contrast completed and blocked tasks, with a blue Success stamp and monochrome/black Blocked treatment. A rough paper texture and bottom system label keep it within the campaign family."},{"id":"PP-33","label":"Two_testing_panels_displayed_355526fe.jpg","kind":"reference_image","description":"A dark, compact dashboard with two contrasting status lists is centered under a large Completed vs Blocked headline. A product mark overlays the dashboard, and the footer identifies the workflow."},{"id":"PP-34","label":"Workday_under_control_poster_22ff92d5.jpg","kind":"reference_image","description":"A tilted collage of connected work tools sits above an oversized Your Workday Under Control headline. The headline occupies the lower region and uses a cobalt block to emphasize the promise."},{"id":"PP-35","label":"Zero_code_setup_document_search_d38c631f.jpg","kind":"brand_asset","description":"Zero Code Setup title above a floating file card and a slim search field on a textured warm-white document surface with a thin cobalt border. The layout is sparse and instructional."},{"id":"ATLAS_SIGNAL","label":"Signal atlas: 10 originals + 1 crop","kind":"asset_atlas","description":"Ten original uploaded images plus one derived poster crop. Four visual modes; no pure-monochrome source was retained."},{"id":"ATLAS_INDUSTRIAL","label":"Industrial atlas: 35 originals","kind":"asset_atlas","description":"Thirty-four poster/product designs plus one master logo asset, each individually mapped and audited. The 35 source images are identical across the two uploaded industrial ZIPs."}],"edges":[{"id":"E0001","source":"STYLE_ROOT","target":"TYPOGRAPHY","relationship":"defines_or_requires"},{"id":"E0002","source":"STYLE_ROOT","target":"GRID","relationship":"defines_or_requires"},{"id":"E0003","source":"STYLE_ROOT","target":"PROOF_OBJECT","relationship":"defines_or_requires"},{"id":"E0004","source":"STYLE_ROOT","target":"TEXTURE","relationship":"defines_or_requires"},{"id":"E0005","source":"STYLE_ROOT","target":"TECH_GEOMETRY","relationship":"defines_or_requires"},{"id":"E0006","source":"STYLE_ROOT","target":"ICONOGRAPHY","relationship":"defines_or_requires"},{"id":"E0007","source":"STYLE_ROOT","target":"CONTENT_TRUTH","relationship":"defines_or_requires"},{"id":"E0008","source":"STYLE_ROOT","target":"QA_3PASS","relationship":"defines_or_requires"},{"id":"E0009","source":"STYLE_ROOT","target":"SIGNAL_FAMILY","relationship":"contains_family"},{"id":"E0010","source":"STYLE_ROOT","target":"INDUSTRIAL_FAMILY","relationship":"contains_family"},{"id":"E0011","source":"SHARED_GRAMMAR","target":"TYPOGRAPHY","relationship":"uses"},{"id":"E0012","source":"SHARED_GRAMMAR","target":"GRID","relationship":"uses"},{"id":"E0013","source":"SHARED {id:'TASTE_PAGE_RHYTHM',label:'Taste Skill page rhythm',kind:'craft_rule',description:'Build from one visual system with clear screen rhythm, equal content edges, readable type and real visual proof. Use the page kind to decide whether imagery, product UI or technical scenes should lead.',source:'Leonxlnx/taste-skill · design-taste-frontend 2.5.1',sourceUrl:'https://github.com/Leonxlnx/taste-skill',confidence:0.98,parent:'STYLE_ROOT'},
{id:'TASTE_REAL_ASSETS',label:'Real assets and semantic proof',kind:'craft_rule',description:'Prefer real photographs, actual product UI, true brand icons and one semantic proof object. Never use visual placeholders as factual evidence or show empty visual frames.',source:'Leonxlnx/taste-skill · house rules',sourceUrl:'https://github.com/Leonxlnx/taste-skill',confidence:0.98,parent:'PROOF_OBJECT'},
{id:'ARTISTIC_WEB_CRAFT',label:'Artistic Web Craft adapter',kind:'motion_extension',description:'Use high-contrast minimalism, hairline grids, restrained HUD details and tactile micro-interactions. Shader or WebGL effects are reserved for products with a real technical subject.',source:'Installed Artistic Web Craft skill',confidence:0.96,parent:'SHARED_GRAMMAR'},
{id:'CRAFT_LENIS_SCROLL',label:'Lenis + GSAP scroll engine',kind:'motion_system',description:'Use Lenis for smooth wheel interpolation and drive lenis.raf from the GSAP ticker. Notify ScrollTrigger on each Lenis scroll and disable GSAP lag smoothing to prevent drift. Keep touch scrolling native and respect reduced motion.',source:'Installed Scroll Choreography Engine · Lenis and GSAP docs',sourceUrl:'https://github.com/darkroomengineering/lenis',confidence:0.99,parent:'ARTISTIC_WEB_CRAFT'},
{id:'CRAFT_REVEAL_RULES',label:'Declarative scroll reveal rules',kind:'motion_pattern',description:'Reveal content in small, purposeful groups. Draw hairline rules from left to right, stagger cards by their physical horizontal position, use scroll triggers only for visible content and refresh after layout changes.',source:'Installed Scroll Choreography Engine',confidence:0.97,parent:'CRAFT_LENIS_SCROLL'},
{id:'CRAFT_ICON_SYSTEM',label:'Unified geometric icon system',kind:'asset_rule',description:'Use one coherent mono-line SVG family with consistent 24px viewBox, stroke width, cap and join. Icons must have a functional semantic role. Export standalone SVGs from the same source symbols.',source:'PixelPie visual memory · ICONOGRAPHY',confidence:0.99,parent:'ICONOGRAPHY'},
{id:'CRAFT_ASSET_PROVENANCE',label:'Asset provenance and local persistence',kind:'workflow',description:'Keep original uploads, derivatives, client-approved files and generated exports distinguishable. Store source metadata and project association with each asset. Deduplicate by SHA-256 before promoting a file into canonical memory.',source:'MASTER_STYLE_SYSTEM.md · ingestion protocol',confidence:0.99,parent:'STYLE_ROOT'},
{id:'CRAFT_RECIPE_LIBRARY',label:'Repeatable production recipes',kind:'workflow',description:'Store reusable project recipes as steps, deliverables, family constraints and QA gates. Recipes are scaffolds, not rigid templates. Preserve family and mode boundaries when reusing them.',source:'Pixel2Vector AI Studio production memory',confidence:0.98,parent:'ROUTER'},
{id:'CRAFT_REDUCED_MOTION',label:'Motion accessibility fallback',kind:'quality_gate',description:'Respect prefers-reduced-motion. Disable smoothing and scroll-linked animation when requested, keep all content visible without JavaScript, and never make interaction depend on animation completing.',source:'Taste Skill · browser consistency principles',sourceUrl:'https://github.com/Leonxlnx/taste-skill',confidence:0.98,parent:'QA_3PASS'},
{id:'ART_ENGINE_SPIRAL',label:'Logarithmic spiral scene geometry',kind:'motion_geometry',description:'The Artistic Web Engine distributes a spiral scene with r = b × theta, six arms on desktop and three on mobile. The included 2D stage previews the exact geometry contract; the original Three.js WebGL scene remains in the imported source package.',source:'artistic-web-engine.zip · 2026-11-09',confidence:1,parent:'ARTISTIC_WEB_CRAFT'},
{id:'ART_ENGINE_SHADER',label:'Card and ribbon GLSL shader set',kind:'shader_system',description:'Preserved GLSL card bowing, cursor warp, Poisson blur, chromatic dispersion, rounded-rectangle SDF framing and pulsing spiral ribbons. WebGL is opt-in for technically relevant projects, never a default effect.',source:'artistic-web-engine.zip · 2026-11-09',confidence:1,parent:'ART_ENGINE_SPIRAL'},
{id:'ART_ENGINE_TIMELINE',label:'Deterministic timeline seek contract',kind:'motion_architecture',description:'Motion scenes can expose window.seek(time, frame) or window.renderFrame(t, f), allowing GSAP DOM timelines and Three.js stages to share a virtual clock for deterministic preview and render.',source:'Artistic Web Engine + Motion Studio system notes',confidence:0.99,parent:'ART_ENGINE_SHADER'},

tivityicon">＋</span><span><b>Create a project</b><small>Set the client, objective and visual family.</small></span></button><button class="activityitem shortcut" data-action="upload"><span class="activityicon">▧</span><span><b>Add source assets</b><small>Keep references, previews and deliverables together.</small></span></button><button class="activityitem shortcut" data-page="Tokens"><span class="activityicon">◈</span><span><b>Open design tokens</b><small>Edit colors and export the active family.</small></span></button><button class="activityitem shortcut" data-page="Memory graph"><span class="activityicon">⌘</span><span><b>Inspect visual memory</b><small>Search source rules, modes and linked references.</small></span></button></div><div class="notice">Local-first prototype. Client presentations export as static HTML; they are not private hosted share links.</div></aside></div>`}

:#555">TYPE HIERARCHY / PREVIEW</div><div class="serif">Engineering emotion<br>into visual systems.</div><small>PIXELPIE MEDIA · DESIGN SYSTEM PREVIEW</small></div></section></div>`}

{id:'saas-launch',name:'SaaS product launch',kind:'software',family:'industrial',tag:'PRODUCT / SOFTWARE',desc:'A product-first story with a true UI proof object, useful workflow explanation and one clear action.',steps:['Positioning','Hero + UI proof','Workflow','Capabilities','Trust','CTA'],brief:'Build a SaaS product page. State the buyer and outcome plainly. Lead with the real product interface as the primary proof object. Explain the workflow in three to five steps, show integrations only when they exist, and finish with one primary action. Keep the Industrial Technical Editorial family unless the project brief justifies another family. Use responsive UI crops, accessible contrast, and a short performance pass.'},
{id:'brand-system',name:'Brand identity system',kind:'service',family:'signal',tag:'IDENTITY / BRAND',desc:'A coherent identity case study from positioning to practical deployment and handoff.',steps:['Brand intent','Visual territories','Identity','Applications','Guidelines','Handoff'],brief:'Create a brand identity system. Start with audience, positioning and constraints. Select one visual family and one mode. Build logo, typography, palette, graphic grammar and real-world applications. Keep master assets intact and produce export variants. Document how the system should be reused, where it should not be used, and how the client can maintain it.'},

{id:'design-qa',name:'Design QA and release gate',kind:'qa',family:'mteb',tag:'QUALITY / RELEASE',desc:'A repeatable three-pass check for visual consistency, content truth and production behavior.',steps:['Brief audit','Visual system','Responsive','Interaction','Accessibility','Release'],brief:'Run a three-pass design QA. Pass one checks brief fidelity, hierarchy and content. Pass two checks family, mode, palette, type, grid, spacing and component consistency. Pass three checks factual accuracy, responsive behavior, keyboard access, reduced motion, broken assets, link targets, performance and final exports. Record defects and verify every fix.'},

function uiPatterns(){let list=patterns.filter(p=>(p[0]+' '+p[1]+' '+p[2]).toLowerCase().includes(query.toLowerCase()));return head('COMPONENT LIBRARY','Reusable interface patterns.','Reusable structural patterns. Adapt content and proportion while preserving hierarchy, contrast and behavior.',`<span class="badge">${patterns.length} STARTER PATTERNS</span>`)+`<div class="pattern-grid">${list.map(p=>`<article class="pattern"><div class="patternvisual ${p[3]}"></div><strong>${p[0]} <span class="badge">${p[1]}</span></strong><p>${p[2]}</p><button class="btn flat" data-action="copy-pattern" data-pattern="${p[0]}">⧉ Copy pattern brief</button></article>`).join('')}</div>`}

function craftPage(){const visible=iconItems.filter(x=>(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(query.toLowerCase()));return head('CRAFT / ICONOGRAPHY / MICRO SYSTEMS','Craft rules and assets.','One coherent icon family, reusable interface fragments and interaction rules for new projects.',`<button class="btn" data-action="export-icon-sprite">↓ Export SVG sprite</button><button class="btn primary" data-page="Recipes">Open recipes ↗</button>`)+`<section class="craft-hero"><div><div class="eyebrow">PIXELPIE CRAFT STANDARD / 01</div><h2>Designed once.<br>Used with intent.</h2><p>Every reusable thing has a role, a source and a rule for when it belongs. Use one icon family with semantic names, consistent stroke and fixed sizing. No random icon mixing. No components without a job.</p><span class="badge">LUCIDE OUTLINE · TOKENS · PATTERNS · MOTION</span></div><div class="craft-orbit"><div class="orbit"></div><div class="craft-core"><svg><use href="#i-layers"/></svg></div></div></section><div class="sectionrow"><h2>Icon system</h2><span>${visible.length} / ${iconItems.length} LUCIDE OUTLINE ICONS</span></div><div class="craft-grid">${visible.map(x=>`<button class="icon-tile" data-action="copy-icon" data-icon="${x[0]}" title="Copy ${x[1]} SVG"><span class="icon-show"><svg><use href="#i-${x[0]}"/></svg></span><b>${x[1]}</b><small>${x[2]}</small><code>Lucide · ${x[0]} · 24px</code></button>`).join('')}</div><div class="sectionrow"><h2>Reusable interaction craft</h2><span>MICRO DETAILS, NOT MOTION NOISE</span></div><div class="snippet-grid">${snippets.filter(x=>['accessible-button','media-frame','lenis-gsap','scroll-reveal'].includes(x.id)).map(x=>`<article class="snippet-card"><div class="recipe-top"><span class="badge">${x.id.toUpperCase()}</span><span class="eyebrow">COPY READY</span></div><h3>${x.name}</h3><p>${x.desc}</p><pre>${esc(x.code)}</pre><button class="btn flat" data-action="copy-snippet" data-snippet="${x.id}">⧉ Copy snippet</button></article>`).join('')}</div><div class="notice good">Craft rule: one icon grammar, one easing language, one meaningful interaction per control. The content remains visible when scripts or motion are unavailable.</div>`}
function recipesPage(){const list=recipes.filter(r=>(r.name+' '+r.tag+' '+r.desc+' '+r.kind).toLowerCase().includes(query.toLowerCase()));return head('REPEATABLE WORKFLOWS / RECIPE BOOK','Repeatable project workflows.','Reusable production recipes for client work, campaigns, SaaS, handoffs and memory capture. Start from the workflow, then tailor the details.',`<button class="btn" data-action="export-recipes">↓ Export recipe book</button>`)+`<div class="recipe-grid">${list.map(r=>`<article class="recipe-card"><div class="recipe-top"><span class="badge">${r.tag}</span><span class="eyebrow">${r.family.toUpperCase()}</span></div><h3>${r.name}</h3><p>${r.desc}</p><div class="recipe-steps">${r.steps.map((step,i)=>`<span>${String(i+1).padStart(2,'0')} / ${step}</span>`).join('')}</div><div class="headbuttons"><button class="btn flat" data-action="copy-recipe" data-recipe="${r.id}">⧉ Copy build brief</button><button class="btn primary" data-action="create-from-recipe" data-recipe="${r.id}">＋ Start project</button></div></article>`).join('')}</div><div class="sectionrow"><h2>Reusable code fragments</h2><span>DROP INTO A PROJECT</span></div><div class="snippet-grid">${snippets.filter(x=>(x.name+' '+x.desc).toLowerCase().includes(query.toLowerCase())).map(x=>`<article class="snippet-card"><div class="recipe-top"><span class="badge">${x.id.toUpperCase()}</span><span class="eyebrow">SNIPPET</span></div><h3>${x.name}</h3><p>${x.desc}</p><pre>${esc(x.code)}</pre><button class="btn flat" data-action="copy-snippet" data-snippet="${x.id}">⧉ Copy code</button></article>`).join('')}</div>`}

function memoryPage(){const rg=currentGraph();let nodes=rg.nodes.filter(n=>(n.label+' '+n.kind+' '+n.description+' '+(n.source||'')).toLowerCase().includes(query.toLowerCase()));return head('SEMANTIC MEMORY / KNOWLEDGE GRAPH','Connected visual memory.','Source visual memory plus craft rules, motion systems, interaction recipes and project-specific decisions. Each node keeps its provenance.',`<button class="btn" data-action="export-graph">↓ Export graph</button><button class="btn primary" data-action="new-memory">＋ Add memory</button>`)+`<div class="graph-stats"><div class="graph-stat"><b>${rg.nodes.length}</b><small>NODES</small></div><div class="graph-stat"><b>${rg.edges.length}</b><small>DIRECTED EDGES</small></div><div class="graph-stat"><b>${nodes.length}</b><small>VISIBLE MATCHES</small></div></div><div class="graphgrid"><section class="panel graphcanvas"><div class="paneltitle"><h3>Visual memory topology</h3><small>SOURCE + CRAFT LAYERS / INTERACTIVE MAP</small></div>${graphSvg()}</section><aside class="panel"><div class="panelpad"><div class="paneltitle"><h3>Memory index</h3><small>${nodes.length} MATCHES</small></div><div class="node-list">${nodes.slice(0,100).map(n=>`<div class="node"><b>${esc(n.label)}</b><small>${esc(n.kind.replaceAll('_',' '))} · ${esc(n.id)}</small><p>${esc(n.description||'')}</p>${n.source?`<div class="memory-source">SOURCE · ${esc(n.source)}</div>`:''}</div>`).join('')}</div></div></aside></div><div class="notice">78 original GraphML nodes and 232 original relationships remain intact. The local memory layer adds craft rules, motion systems, recipes and custom decisions without rewriting source history. Local additions persist in this browser profile.</div>`}
function graphSvg(){const rg=currentGraph(),ns=rg.nodes,cx=360,cy=260,positions={};ns.forEach((n,i)=>{if(n.id==='STYLE_ROOT'){positions[n.id]=[cx,cy];return}const kind=n.kind||'';const group=kind==='style_family'?105:kind==='palette'?160:kind==='reference_image'?225:kind==='motion_system'?125:kind==='motion_extension'?150:kind==='motion_pattern'?175:kind==='craft_rule'?195:kind==='workflow'?205:190;const a=i*2.399963;positions[n.id]=[cx+Math.cos(a)*group,cy+Math.sin(a)*group*.7]});const edges=rg.edges.filter(e=>positions[e.source]&&positions[e.target]);const ln=edges.map(e=>`<line x1="${positions[e.source][0]}" y1="${positions[e.source][1]}" x2="${positions[e.target][0]}" y2="${positions[e.target][1]}" stroke="#536273" stroke-opacity=".22" stroke-width="1"/>`).join('');const dots=ns.map(n=>{const [x,y]=positions[n.id],r=n.kind==='style_system'?17:n.kind==='style_family'?10:n.kind==='reference_image'?3.4:n.kind==='motion_system'?8:n.kind==='craft_rule'?6.5:5.3,fill=n.kind==='style_system'?'#f0f3f7':n.kind==='style_family'?'#77a4ff':n.kind==='reference_image'?'#52bbc6':n.kind==='palette'?'#dfac69':n.kind.includes('motion')?'#a3d3dc':n.kind.includes('craft')?'#85c6ba':'#8797ab';return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" fill-opacity=".9"><title>${esc(n.label)} · ${esc(n.kind)}</title></circle>`}).join('');return `<svg viewBox="0 0 720 520" role="img" aria-label="Connected visual memory graph">${ln}${dots}<text x="360" y="264" text-anchor="middle" fill="#121820" font-size="8" font-weight="800">ROOT</text><text x="18" y="500" fill="#718091" font-size="9">${ns.length} NODES · ${edges.length} RELATIONSHIPS · SOURCE + LOCAL CRAFT</text></svg>`}
function guide(){let items=[['01','Route the visual intent','Select the medium and communication goal, then choose one visual family and one mode.'],['02','Create a project container','Attach the client, objective, status, brief, deliverables and references to one project.'],['03','Apply tokens before components','Use semantic names such as surface, text, accent and muted. Avoid repeating raw hex values.'],['04','Compose from patterns','Adapt structure and content. Preserve hierarchy, responsive behavior and legibility.'],['05','Attach artifacts and memory','Keep source files and exports together. Save durable decisions as graph nodes.'],['06','Share only the selected output','Export a clean client preview. Do not expose internal notes or source references.']];return head('OPERATING MANUAL','A practical workflow.','Start with intent, select a visual family, then build from tokens and patterns.')+`<div class="guide">${items.map(([n,t,d])=>`<div class="guideitem"><span class="num">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div><section class="panel panelpad" style="margin-top:14px"><div class="eyebrow">CANONICAL MEMORY RULES</div><div class="guide" style="margin-top:12px"><div class="guideitem"><span class="num">A</span><div><h3>Family separation</h3><p>Signal Editorial and Industrial Technical Editorial are distinct source families. Neo-Brutalist modes remain siblings. MTEB v1.1.0 is canonical.</p></div></div><div class="guideitem"><span class="num">B</span><div><h3>Classify before ingestion</h3><p>Incoming material must be classified as family, mode, motion extension, production tool, product asset or product evidence.</p></div></div><div class="guideitem"><span class="num">C</span><div><h3>Preserve provenance</h3><p>Deduplicate by SHA-256. Never overwrite history or promote inferred traits to observed facts.</p></div></div><div class="guideitem"><span class="num">D</span><div><h3>Three-pass quality gate</h3><p>Review brief and hierarchy, visual system consistency, then factual integrity, legibility and production craft.</p></div></div></div></section><div class="notice">Cloud deployment target: Workers + Static Assets for the app, D1 for project and graph metadata, R2 for original media and deliverables. This standalone HTML runs locally and does not connect to those services.</div>`}

oot</option><option value="SHARED_GRAMMAR">Shared visual grammar</option><option value="ICONOGRAPHY">Functional iconography</option><option value="PROOF_OBJECT">Semantic proof object</option><option value="ROUTER">Family and mode router</option><option value="CRAFT_LENIS_SCROLL">Lenis + GSAP scroll engine</option></select></div><div class="field"><label>SOURCE / PROVENANCE</label><input name="source" placeholder="Client brief, URL, reference file or observation"></div>`}<div class="modalactions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary">Save to workspace</button></div></form></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modalroot').innerHTML='';$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')$('#modalroot').innerHTML=''};$('#modal').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(isProject){let p={id:'p'+Date.now(),name:f.get('name'),client:f.get('client'),type:f.get('type'),status:'Planning',family:f.get('family'),desc:f.get('desc'),notes:'',date:new Date().toISOString().slice(0,10)};state.projects.unshift(p);selected=p.id;family=p.family}else state.memories.push({id:'m'+Date.now(),label:f.get('label'),kind:f.get('kind'),description:f.get('desc'),parent:f.get('parent')||'STYLE_ROOT',source:f.get('source')||'User-authored local memory',confidence:1});persist();$('#modalroot').innerHTML='';render();toast(isProject?'Project created':'Memory node added')}}

async function shareHtml(){const p=current(),desc=$('#shareDesc')?.value||p.desc,client=$('#shareClient')?.value||p.client,related=assets.filter(a=>a.project===p.name);const cards=(await Promise.all(related.map(async a=>{let src='';try{if(a.blob&&a.blob.size<=15*1024*1024)src=await blobDataUrl(a.blob);else if(a.url.startsWith('data:'))src=a.url}catch{}if(a.type==='image'&&src)return `<img src="${src}" alt="${esc(a.name)}">`;if(a.type==='video'&&src)return `<video src="${src}" controls playsinline></video>`;return `<div class="file">${esc(a.name)}<small>${a.type==='video'?'Video file too large to embed':'Source file'} · Share the original separately</small></div>`}))).join('');return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="description" content="${esc(desc).slice(0,150)}"><title>${esc(p.name)} | Presentation</title><style>*{box-sizing:border-box}body{margin:0;background:#101318;color:#f4f5f7;font:16px Inter,Arial;padding:5vw}main{max-width:1100px;margin:auto}.meta{font:10px monospace;letter-spacing:2px;color:#9cabc1}h1{font-size:clamp(48px,10vw,110px);letter-spacing:-.07em;line-height:.88;margin:30px 0}p{color:#b4bdc8;line-height:1.65;max-width:700px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:35px}img,video{width:100%;display:block;border-radius:10px}.file{padding:28px;background:#1a2028;border:1px solid #38424d;border-radius:10px}.file small{display:block;color:#9aa8b7;margin-top:8px}footer{margin-top:60px;color:#8793a2;font:10px monospace}</style><main><div class="meta">${esc(client.toUpperCase())} / PROJECT PRESENTATION</div><h1>${esc(p.name)}</h1><p>${esc(desc)}</p><div class="grid">${cards}</div><footer>PREPARED WITH Pixel2Vector AI Studio</footer></main></html>`}

function doAction(action, el) {
  switch (action) {
    case 'new-project': openModal('project'); break;
    case 'new-memory': openModal('memory'); break;
    case 'upload': {
      let input = $('#fileInput');
      if (!input) {
        input = document.createElement('input');
        input.type = 'file'; input.multiple = true;
        input.accept = 'image/*,video/*,.pdf,.svg,.zip,.psd,.ai,.fig';
        input.id = 'fileInput'; input.className = 'hidden'; document.body.append(input);
      }
      input.onchange = async () => {
        const files = [...input.files]; input.value = '';
        for (const file of files) {
          const type = file.type.startsWith('image') ? 'image' : file.type.startsWith('video') ? 'video' : 'file';
          const id = `a${Date.now()}${Math.random().toString(36).slice(2,7)}`;
          const asset = {id, name:file.name, size:file.size, type, blob:file,
            url:type === 'file' ? '' : URL.createObjectURL(file), project:current().name,
            lastModified:file.lastModified, addedAt:new Date().toISOString()};
          assets.unshift(asset); if (asset.url) assetUrls.push(asset.url);
          try { await saveAssetBlob({...asset,url:''}, file); }
          catch (err) { toast('Previewed, but local persistence failed: ' + err.message); }
        }
        persist(); render(); toast(files.length + ' asset(s) added to local library');
      };
      input.click(); break;
    }
    case 'export-css': exportText(`${family}-tokens.css`, cssTokens(), 'text/css'); break;
    case 'copy-css': copyText(cssTokens(), 'CSS tokens copied'); break;
    case 'export-share':
      shareHtml().then(html => exportText(`${current().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-client-preview.html`, html, 'text/html'))
        .catch(err => toast('Client preview export failed: ' + err.message));
      break;
    case 'export-graph': exportText('pickko-visual-memory-graph.json', JSON.stringify(currentGraph(),null,2), 'application/json'); break;
    case 'copy-pattern': {
      const pattern = patterns.find(x => x[0] === el.dataset.pattern);
      if (pattern) copyText(`${pattern[0]} / ${pattern[1]}
${pattern[2]}`, 'Pattern brief copied');
      break;
    }
    case 'download-asset': {
      const asset = assets[Number(el.dataset.downloadasset)];
      if (!asset) break;
      const download = blob => {
        if (!blob) { toast('Original file is not available in this browser'); return; }
        const url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = asset.name; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      if (asset.blob) download(asset.blob);
      else openAssetDB().then(db => new Promise((resolve,reject) => {
        const req = db.transaction('assets','readonly').objectStore('assets').get(asset.id);
        req.onsuccess = () => resolve(req.result?.blob); req.onerror = () => reject(req.error);
      })).then(download).catch(err => toast('Could not read local asset: ' + err.message));
      break;
    }
    case 'copy-icon': copyText(iconSvgMarkup(el.dataset.icon), el.dataset.icon + '.svg copied'); break;
    case 'copy-snippet': {
      const snippet = snippets.find(x => x.id === el.dataset.snippet);
      if (snippet) copyText(snippet.code, 'Snippet copied');
      break;
    }
    case 'copy-recipe': {
      const recipe = recipes.find(x => x.id === el.dataset.recipe);
      if (recipe) {
        const lineBreak = String.fromCharCode(10);
        const steps = recipe.steps.map((x,i) => String(i+1) + '. ' + x).join(lineBreak);
        copyText('# ' + recipe.name + lineBreak + lineBreak + recipe.desc + lineBreak + lineBreak + steps + lineBreak + lineBreak + recipe.brief, 'Recipe brief copied');
      }
      break;
    }
    case 'create-from-recipe': {
      const recipe = recipes.find(x => x.id === el.dataset.recipe);
      if (recipe) {
        const project = {id:'p'+Date.now(), name:recipe.name+' / New project', client:'Internal', type:recipe.kind,
          status:'Planning', family:recipe.family, desc:recipe.brief, notes:'Created from Pixel2Vector AI Studio recipe: '+recipe.name,
          date:new Date().toISOString().slice(0,10), recipe:recipe.id};
        state.projects.unshift(project); selected=project.id; family=project.family; persist(); setPage('Projects'); toast('Project scaffold created');
      }
      break;
    }
    case 'copy-engine-brief': copyText('Build an artistic web experience using the imported Artistic Web Engine. Select one PixelPie visual family and preserve its palette boundaries. Use Lenis + GSAP ScrollTrigger for smooth, choreographed scrolling; use the deterministic spiral math and Three.js/GLSL scene only when the subject benefits from spatial technical visuals. Respect reduced motion, mobile performance and static fallbacks. Source archive: imports/artistic-web-engine.zip. Source provenance and component contracts are indexed in the Pixel2Vector AI Studio memory graph.', 'Artistic engine brief copied'); break;
    case 'create-engine-project': { const project={id:'p'+Date.now(),name:'Artistic web experience / New project',client:'Internal',type:'Website / Motion',status:'Planning',family:'industrial',desc:'A high-craft web experience using the Artistic Web Engine with measured GSAP choreography, Lenis smooth scroll and optional Three.js spatial visuals.',notes:'Use Taste Skill page planning. Select WebGL only when the subject earns it. Respect reduced motion and preserve a static fallback.',date:new Date().toISOString().slice(0,10),engine:'artistic-web-engine'};state.projects.unshift(project);selected=project.id;family=project.family;persist();setPage('Projects');toast('Artistic project scaffold created');break; }
    case 'export-recipes': exportText('pickko-production-recipes.json', JSON.stringify(recipes,null,2), 'application/json'); break;
    case 'export-icon-sprite': {
      const symbols = [...document.querySelectorAll('.svg-sprite symbol')].map(x => x.outerHTML).join(String.fromCharCode(10));
      exportText('pixelpie-lucide-icon-system.svg', `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">${symbols}</svg>`, 'image/svg+xml');
      break;
    }
  }
}
$('#view').addEventListener('click',e=>{let pageBtn=e.target.closest('[data-page]');if(pageBtn&&!pageBtn.dataset.action){setPage(pageBtn.dataset.page);return}let act=e.target.closest('[data-action]');if(act){doAction(act.dataset.action,act);return}let dl=e.target.closest('[data-downloadasset]');if(dl){doAction('download-asset',dl);return}let fam=e.target.closest('[data-family]');if(fam){family=fam.dataset.family;persist();render();return}let card=e.target.closest('[data-openproject]');if(card){selected=card.dataset.openproject;setPage('Client share');return}let rm=e.target.closest('[data-removeasset]');if(rm){const a=assets.splice(+rm.dataset.removeasset,1)[0];if(a){if(a.url)URL.revokeObjectURL(a.url);deleteAssetBlob(a.id)}render();toast('Asset removed')}});
$('#view').addEventListener('change',e=>{if(e.target.matches('[data-color]')){state.tokens[family].colors[e.target.dataset.color]=e.target.value;persist();render()}if(e.target.id==='shareProject'){selected=e.target.value;render()} });
$('#view').addEventListener('input',e=>{if(e.target.id==='shareDesc'||e.target.id==='shareClient'){let h=$('.previewinner');if(h){h.querySelector('p').textContent=$('#shareDesc').value;h.querySelector('small').textContent=$('#shareClient').value.toUpperCase()+' / PROJECT PRESENTATION'}}});
$('#exportWorkspace').onclick=()=>exportText('pickko-workspace.json',JSON.stringify({...state,graph:currentGraph(),assets:assets.map(({url,...a})=>a)},null,2),'application/json');
document.documentElement.dataset.currentPage=page;
render();
restoreAssets();
loadMotionLibraries();
window.addEventListener('resize',()=>{if(window.ScrollTrigger)ScrollTrigger.refresh()});
window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-window.innerHeight;if(max>0)updateScrollHud(window.scrollY/max);else updateScrollHud(0)},{passive:true});
})();
</script></body></html>
